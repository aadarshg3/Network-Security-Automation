vmanage:
  host: "https://vManage-ip"
  username: "admin"
  verify_ssl: false
  timeout_seconds: 30
  retry_attempts: 3
  retry_delay_seconds: 5
  poll_timeout_seconds: 180
  poll_interval_seconds: 5

paths:
  excel_input: "configs/newvalues.xlsx"
  state_file: "sdwan_state.json"
  reports_dir: "outputs"
  backups_dir: "backups"
  logs_dir: "logs"

soft_error_patterns:
  - "error in generating configuration diff"
  - "error generating configuration diff"
  - "generating configuration diff"
  - "config diff generation"

deploy:
  dry_run: false
  force: false
  attach_timeout: 180
  rollback_on_failure: true

logging:
  level: "INFO"
  format: "%(asctime)s  %(levelname)-8s  %(name)s - %(message)s"
