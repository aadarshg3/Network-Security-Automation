[cisco_devices]
router1 ansible_host=192.168.1.1
switch1 ansible_host=192.168.1.2
switch2 ansible_host=192.168.1.3

[cisco_devices:vars]
ansible_user=admin
ansible_password=cisco123
ansible_connection=network_cli
ansible_network_os=ios
ansible_become=yes
ansible_become_method=enable
ansible_become_password=enable_password

[cisco_devices]
router1 ansible_host=192.168.1.1 ansible_hostname=router1
switch1 ansible_host=192.168.1.2 ansible_hostname=switch1
switch2 ansible_host=192.168.1.3 ansible_hostname=switch2

[cisco_devices:vars]
ansible_user=admin
ansible_password=cisco123
ansible_connection=network_cli
ansible_network_os=ios
ansible_become=yes
ansible_become_method=enable
ansible_become_password=enable_password


