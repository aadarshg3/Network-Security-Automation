---
- name: Gather interface status from Cisco switches
  hosts: switches
  gather_facts: no
  collections:
    - cisco.ios
  tasks:
    - name: Collect facts from Cisco devices
      cisco.ios.ios_facts: 
        gather_subset:
          - interfaces
      register: interface_facts

    - name: "1010 - OUTPUT INTERFACE FACTS"
      debug:
        var: interface_facts


