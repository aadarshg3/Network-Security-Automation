# install_apache.yml

- name: Install and start Apache on web servers  # Title of the play
  hosts: servera                                 # Target machines from inventory
  become: yes                                    # Use sudo/root privileges

  tasks:
    - name: Install Apache HTTP server           # First task
      ansible.builtin.yum:                       # Using yum module
        name: httpd                              # The package to install
        state: present                           # Ensure it's installed

    - name: Start and enable Apache service      # Second task
      ansible.builtin.service:                   # Using service module
        name: httpd                              # The service to manage
        state: started                           # Make sure it is running
        enabled: yes                             # Start it on system boot

