---
- name: "1020A NORMALIZE PROBLEM SUMMARY LINE BREAKS"
  set_fact:
    normalized_ps: "{{ Description | replace('\\r', '') | replace('\\n', '\n') }}"

- name: "1021 EXTRACT INCIDENT TYPE FROM PROBLEM SUMMARY"
  set_fact:
    incTypePrbSum: "{{ (normalized_ps.split('\n') | select('match', '^INCIDENT TYPE: ') | list | default([''], true))[0] | regex_replace('^INCIDENT TYPE: ', '') | default('') }}"

- name: "1021B FALLBACK INCIDENT TYPE FROM REGEX"
  set_fact:
    incTypePrbSum: "{{ (normalized_ps | regex_search('INCIDENT TYPE[:]?\\s*([^\\n]+)', '\\1') or ['']) | first }}"
  when: incTypePrbSum == ""

- name: "1022 STRIP SOURCED FROM INCIDENT TYPE"
  set_fact:
    incidentType: "{{ incTypePrbSum.split('SOURCED')[0] | trim | default('') }}"

- debug: var=incidentType

- name: "1023 EXTRACT ASSURE1 ALARM ID"
  set_fact:
    assureAlarmID: "{{ (normalized_ps | regex_search('ASSURE1 ALARM ID: (\\d+)', '\\1') or ['0']) | first }}"

- debug: var=assureAlarmID

- name: "1024 EXTRACT ALARM TEXT"
  set_fact:
    alarm_text: "{{ (normalized_ps | regex_search('TEXT: ([^\\n]+)', '\\1') or ['N/A']) | first | trim }}"

- name: "1025 EXTRACT VPN ID FROM ALARM TEXT"
  set_fact:
    vpn_id: "{{ alarm_text | extract_vpn_from_text }}"

- debug: var=vpn_id

- name: "1025B EXTRACT PEER SYSTEM-IP FROM ALARM TEXT"
  set_fact:
    peer_sysip: "{{ alarm_text | extract_peer_sysip_from_text }}"

- debug: var=peer_sysip

- name: "1026 VALIDATE INCIDENT TYPE IS BGPROUTERUPDOWN"
  ansible.builtin.fail:
    msg: "Incident type '{{ incidentType }}' is not BGPRouterUpDown. Aborting."
  when: "'BGPRouterUpDown' not in incidentType"

- name: "1027 WRITE SUMMARY HEADER TO OUTPUT FILE"
  lineinfile:
    path: "{{ output_file }}"
    create: yes
    line: |
      {{ domain | default(DNSEntityName) }}#{{ DNSEntityName }}#Success# SELECTED PLAYBOOK: BGP-Router-Up-Down-Viptela
      {{ "=" * 25 }} SUMMARY REPORT {{ runDate }} {{ "=" * 25 }}
      Hostname / IP : {{ entityHostName | default(DNSEntityName) }} / {{ MgmtIP }}
      NEID          : {{ DNSEntityName }}
      Incident Type : {{ incidentType }}
      Peer System-IP: {{ peer_sysip | default('N/A') }}
      VPN ID        : {{ vpn_id | default('0') }}
      Alarm Text    : {{ alarm_text }}
      Alarm Start   : {{ incidentStartTime | default('N/A') }}
      Run Date/Time : {{ runDateTime }} UTC
      {{ "-" * 78 }}
  delegate_to: localhost

- name: "1028 WRITE OBSERVATIONS HEADER"
  lineinfile:
    path: "{{ output_file }}"
    line: "=+=+=+=+=+=+=+=+=+=+=+=+=+=+=+=+=+=+=+=+=+=+\n\nObservations:"
  delegate_to: localhost
