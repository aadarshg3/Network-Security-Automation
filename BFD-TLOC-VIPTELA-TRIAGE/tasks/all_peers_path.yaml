---
- name: "1131 RUN FULL DIAGNOSTIC BUNDLE (VEDGE)"
  ansible.builtin.script:
    executable: /usr/bin/python3
    cmd: >
      roles/BFD-TLOC-VIPTELA-TRIAGE/tasks/bfd_ssh.py
      '{"host": "{{ MgmtIP }}", "username": "{{ ansible_user }}", "password": "{{ ansible_password }}", "device_type": "cisco_ios", "commands": ["show version", "show hardware inventory", "show bfd sessions", "show bfd sessions local-color {{ tloc_color }}", "show bfd history color {{ tloc_color }}", "show control connections", "show omp peers", "show omp tlocs", "show interface", "show tunnel statistics", "show system statistics", "show processes", "show ip route", "show policy service-path"]}'
  register: diag_raw_vedge
  when: platform == 'vedge'
  delegate_to: localhost
  no_log: true
  ignore_errors: true

- name: "1132 RUN FULL DIAGNOSTIC BUNDLE (CEDGE)"
  ansible.builtin.script:
    executable: /usr/bin/python3
    cmd: >
      roles/BFD-TLOC-VIPTELA-TRIAGE/tasks/bfd_ssh.py
      '{"host": "{{ MgmtIP }}", "username": "{{ ansible_user }}", "password": "{{ ansible_password }}", "device_type": "cisco_ios", "commands": ["show sdwan version", "show inventory", "show sdwan bfd sessions", "show sdwan bfd sessions | include {{ tloc_color }}", "show sdwan bfd history | include {{ tloc_color }}", "show sdwan control connections", "show sdwan omp peers", "show sdwan omp tlocs", "show sdwan interface", "show sdwan tunnel statistics", "show sdwan tunnels", "show sdwan ipsec sa", "show system statistics", "show processes cpu", "show ip route", "show sdwan policy service-path"]}'
  register: diag_raw_cedge
  when: platform == 'cedge'
  delegate_to: localhost
  no_log: true
  ignore_errors: true

- name: "1133 PARSE DIAGNOSTIC BUNDLE OUTPUT (VEDGE)"
  set_fact:
    diag_parsed_vedge: "{{ diag_raw_vedge.stdout | from_json }}"
  when: platform == 'vedge' and diag_raw_vedge.stdout is defined
  ignore_errors: true

- name: "1133B PARSE DIAGNOSTIC BUNDLE OUTPUT (CEDGE)"
  set_fact:
    diag_parsed_cedge: "{{ diag_raw_cedge.stdout | from_json }}"
  when: platform == 'cedge' and diag_raw_cedge.stdout is defined
  ignore_errors: true

- name: "1136 SET ESCALATE TIER 2 FLAG"
  set_fact:
    escalate_tier2: true
  when: not (bfd_confirmed_up | default(false) | bool)

- name: "1137 WRITE DIAGNOSTIC BUNDLE TO OUTPUT"
  lineinfile:
    path: "{{ output_file }}"
    line: |
      Diagnostic Bundle Collected:
        - Commands run: show version, show bfd sessions, show control connections, show omp peers, show omp tlocs, show interface, show tunnel statistics, show system statistics, show processes, show ip route
        - Refer to Tier 2 team for analysis of above data.
  delegate_to: localhost
  when: escalate_tier2 | bool
