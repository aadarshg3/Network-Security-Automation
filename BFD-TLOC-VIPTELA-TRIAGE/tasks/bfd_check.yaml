---
- name: "1061 RUN BFD SESSION AND HISTORY COMMANDS (VEDGE)"
  ansible.builtin.script:
    executable: /usr/bin/python3
    cmd: >
      roles/BFD-TLOC-VIPTELA-TRIAGE/tasks/bfd_ssh.py
      '{"host": "{{ MgmtIP }}", "username": "{{ ansible_user }}", "password": "{{ ansible_password }}", "device_type": "cisco_ios", "commands": ["show bfd sessions", "show bfd summary", "show bfd sessions local-color {{ tloc_color }}", "show bfd sessions detail", "show bfd history color {{ tloc_color }}", "show log | i BFD", "show log | i tloc"]}'
  register: bfd_raw_vedge
  when: platform == 'vedge' or platform == ''
  delegate_to: localhost
  no_log: true
  ignore_errors: true

- name: "1062 RUN BFD SESSION AND HISTORY COMMANDS (CEDGE)"
  ansible.builtin.script:
    executable: /usr/bin/python3
    cmd: >
      roles/BFD-TLOC-VIPTELA-TRIAGE/tasks/bfd_ssh.py
      '{"host": "{{ MgmtIP }}", "username": "{{ ansible_user }}", "password": "{{ ansible_password }}", "device_type": "cisco_ios", "commands": ["show sdwan bfd sessions", "show sdwan bfd sessions | include {{ tloc_color }}", "show sdwan bfd history", "show sdwan bfd history | include {{ tloc_color }}", "show log | i BFD", "show log | i tloc"]}'
  register: bfd_raw_cedge
  when: platform == 'cedge' or platform == ''
  delegate_to: localhost
  no_log: true
  ignore_errors: true

- name: "1063 PARSE BFD SCRIPT OUTPUT (VEDGE)"
  set_fact:
    bfd_parsed_vedge: "{{ bfd_raw_vedge.stdout | from_json }}"
  when: (platform == 'vedge' or platform == '') and bfd_raw_vedge.stdout is defined and bfd_raw_vedge.rc | default(1) == 0
  ignore_errors: true

- name: "1063B PARSE BFD SCRIPT OUTPUT (CEDGE)"
  set_fact:
    bfd_parsed_cedge: "{{ bfd_raw_cedge.stdout | from_json }}"
  when: platform == 'cedge' and bfd_raw_cedge.stdout is defined and bfd_raw_cedge.rc | default(1) == 0
  ignore_errors: true

- name: "1064 NORMALIZE BFD RAW OUTPUT — PLATFORM KNOWN"
  set_fact:
    bfd_raw_output: "{{ (bfd_parsed_vedge.output | default({})) if platform == 'vedge' else (bfd_parsed_cedge.output | default({})) }}"
  when: platform != ''

- name: "1064B NORMALIZE BFD RAW OUTPUT — PLATFORM UNKNOWN MERGE BOTH"
  set_fact:
    bfd_raw_output: >
      {{
        (bfd_parsed_vedge.output | default({})) |
        combine(bfd_parsed_cedge.output | default({}))
      }}
  when: platform == ''

- name: "1065 PARSE BFD SESSIONS"
  set_fact:
    bfd_sessions: "{{ bfd_raw_output | parse_bfd_sessions(tloc_color) }}"

- name: "1066 PARSE BFD HISTORY"
  set_fact:
    bfd_history: "{{ bfd_raw_output | parse_bfd_history(tloc_color) }}"

- name: "1067 DETERMINE BFD UP/DOWN STATE"
  set_fact:
    bfd_up: "{{ bfd_sessions | selectattr('state', 'equalto', 'up') | list | length > 0 }}"

- debug:
    msg: "BFD TLOC {{ tloc_color }}: {{ 'UP' if bfd_up | bool else 'DOWN' }} ({{ bfd_sessions | length }} sessions)"

- name: "1068 DETECT BFD NOT CONFIGURED"
  set_fact:
    bfd_not_configured: "{{ bfd_raw_output | is_bfd_not_configured }}"

- name: "1069 WRITE BFD NOT CONFIGURED NOTE"
  lineinfile:
    path: "{{ output_file }}"
    line: "BFD Status: BFD is not configured on this device for TLOC color {{ tloc_color }}."
  delegate_to: localhost
  when: bfd_not_configured | default(false) | bool

- name: "1069B WARN — BFD SESSION DATA UNAVAILABLE"
  block:
    - debug:
        msg: >
          BFD SESSION DATA UNAVAILABLE for {{ MgmtIP }}.
          NOC: SSH to device and run 'show bfd sessions' (vedge) or
          'show sdwan bfd sessions' (cedge) manually.
    - lineinfile:
        path: "{{ output_file }}"
        line: |
          WARNING [BFD STATE]: No BFD session data retrieved for TLOC {{ tloc_color }}.
            Cause: SSH error / bundle timeout / parse returned empty.
            NOC: Run 'show bfd sessions' and 'show control connections' manually.
      delegate_to: localhost
  when:
    - bfd_sessions | default([]) | length == 0
    - not (bfd_not_configured | default(false) | bool)
  rescue:
    - set_fact:
        bfd_sessions: []
    - lineinfile:
        path: "{{ output_file }}"
        line: "ERROR [BFD PARSE]: Filter exception. NOC: manual investigation."
      delegate_to: localhost
    - ansible.builtin.meta: clear_host_errors
