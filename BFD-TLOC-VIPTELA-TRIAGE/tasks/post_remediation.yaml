---
- name: "1151 RECHECK BFD AFTER BOUNCE (VEDGE)"
  ansible.builtin.script:
    executable: /usr/bin/python3
    cmd: >
      roles/BFD-TLOC-VIPTELA-TRIAGE/tasks/bfd_ssh.py
      '{"host": "{{ MgmtIP }}", "username": "{{ ansible_user }}", "password": "{{ ansible_password }}", "device_type": "cisco_ios", "commands": ["show bfd sessions", "show bfd summary", "show bfd sessions local-color {{ tloc_color }}"]}'
  register: post_raw_vedge
  when: platform == 'vedge'
  delegate_to: localhost
  no_log: true
  ignore_errors: true

- name: "1152 RECHECK BFD AFTER BOUNCE (CEDGE)"
  ansible.builtin.script:
    executable: /usr/bin/python3
    cmd: >
      roles/BFD-TLOC-VIPTELA-TRIAGE/tasks/bfd_ssh.py
      '{"host": "{{ MgmtIP }}", "username": "{{ ansible_user }}", "password": "{{ ansible_password }}", "device_type": "cisco_ios", "commands": ["show sdwan bfd sessions", "show sdwan bfd sessions | include {{ tloc_color }}", "show sdwan bfd history"]}'
  register: post_raw_cedge
  when: platform == 'cedge'
  delegate_to: localhost
  no_log: true
  ignore_errors: true

- name: "1153 PARSE POST REMEDIATION OUTPUT (VEDGE)"
  set_fact:
    post_parsed_vedge: "{{ post_raw_vedge.stdout | from_json }}"
  when: platform == 'vedge' and post_raw_vedge.stdout is defined
  ignore_errors: true

- name: "1153B PARSE POST REMEDIATION OUTPUT (CEDGE)"
  set_fact:
    post_parsed_cedge: "{{ post_raw_cedge.stdout | from_json }}"
  when: platform == 'cedge' and post_raw_cedge.stdout is defined
  ignore_errors: true

- name: "1154 NORMALIZE POST REMEDIATION OUTPUT"
  set_fact:
    post_bfd_output: "{{ (post_parsed_vedge.output | default({})) if platform == 'vedge' else (post_parsed_cedge.output | default({})) }}"

- name: "1155 PARSE POST REMEDIATION BFD SESSIONS"
  set_fact:
    post_bfd_sessions: "{{ post_bfd_output | parse_bfd_sessions(tloc_color) }}"

- name: "1156 SET POST REMEDIATION BFD STATE"
  set_fact:
    bfd_confirmed_up: "{{ post_bfd_sessions | selectattr('state', 'equalto', 'up') | list | length > 0 }}"
    closure_ready: "{{ post_bfd_sessions | selectattr('state', 'equalto', 'up') | list | length > 0 }}"
