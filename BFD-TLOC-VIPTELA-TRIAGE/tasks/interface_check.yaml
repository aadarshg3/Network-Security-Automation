---
- name: "1091 RUN INTERFACE COMMANDS (VEDGE)"
  ansible.builtin.script:
    executable: /usr/bin/python3
    cmd: >
      roles/BFD-TLOC-VIPTELA-TRIAGE/tasks/bfd_ssh.py
      '{"host": "{{ MgmtIP }}", "username": "{{ ansible_user }}", "password": "{{ ansible_password }}", "device_type": "cisco_ios", "commands": ["show interface {{ tloc_color }}", "show interfaces description", "show control local-properties"]}'
  register: intf_raw_vedge
  when: platform == 'vedge'
  delegate_to: localhost
  no_log: true
  ignore_errors: true

- name: "1092 RUN INTERFACE COMMANDS (CEDGE)"
  ansible.builtin.script:
    executable: /usr/bin/python3
    cmd: >
      roles/BFD-TLOC-VIPTELA-TRIAGE/tasks/bfd_ssh.py
      '{"host": "{{ MgmtIP }}", "username": "{{ ansible_user }}", "password": "{{ ansible_password }}", "device_type": "cisco_ios", "commands": ["show sdwan interface", "show interfaces description", "show sdwan control local-properties"]}'
  register: intf_raw_cedge
  when: platform == 'cedge'
  delegate_to: localhost
  no_log: true
  ignore_errors: true

- name: "1093 PARSE INTERFACE OUTPUT (VEDGE)"
  set_fact:
    intf_parsed_vedge: "{{ intf_raw_vedge.stdout | from_json }}"
  when: platform == 'vedge' and intf_raw_vedge.stdout is defined
  ignore_errors: true

- name: "1093B PARSE INTERFACE OUTPUT (CEDGE)"
  set_fact:
    intf_parsed_cedge: "{{ intf_raw_cedge.stdout | from_json }}"
  when: platform == 'cedge' and intf_raw_cedge.stdout is defined
  ignore_errors: true

- name: "1094 NORMALIZE INTERFACE OUTPUT"
  set_fact:
    interface_raw_output: "{{ (intf_parsed_vedge.output | default({})) if platform == 'vedge' else (intf_parsed_cedge.output | default({})) }}"

- name: "1095 PARSE INTERFACE STATUS"
  set_fact:
    interface_status: "{{ interface_raw_output | parse_interface_status(tloc_color) }}"

- name: "1096 SET TLOC LOCAL FLAG"
  set_fact:
    tloc_local: "{{ interface_raw_output | is_tloc_local(tloc_color) }}"

- name: "1098 SET INTERFACE DOWN FLAG"
  set_fact:
    interface_down: "{{ interface_status.state | default('up') | lower in ['down', 'admin down', 'administratively down'] }}"

- name: "1099 WARN — INTERFACE DATA UNAVAILABLE"
  block:
    - debug:
        msg: >
          INTERFACE DATA UNAVAILABLE for {{ MgmtIP }}.
          NOC: SSH to device and run 'show interface {{ tloc_color }}' (vedge) or
          'show sdwan interface' (cedge) manually.
    - lineinfile:
        path: "{{ output_file }}"
        line: |
          WARNING [INTERFACE STATE]: No interface data retrieved for TLOC {{ tloc_color }}.
            Cause: SSH error / bundle timeout / parse returned empty.
            NOC: Run 'show interface' / 'show sdwan interface' manually.
      delegate_to: localhost
  when: interface_raw_output | default({}) | length == 0
  rescue:
    - set_fact:
        interface_status: {name: '', state: 'unknown'}
        tloc_local: false
        interface_down: false
    - lineinfile:
        path: "{{ output_file }}"
        line: "ERROR [INTERFACE PARSE]: Filter exception. NOC: manual investigation."
      delegate_to: localhost
    - ansible.builtin.meta: clear_host_errors
